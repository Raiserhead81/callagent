; CallAgent - Asterisk PJSIP (verwaltet von /opt/callagent/sip/sip-konfig.sh)
; Nur benannte Endpunkte, KEIN anonymer Zugang.
[global]
type=global
user_agent=CallAgent
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Lokaler Selbsttest: Asterisk ruft sich selbst ueber 127.0.0.1 an (echtes SIP+RTP)
[selbsttest]
type=endpoint
context=callagent-in
disallow=all
allow=alaw,ulaw
aors=selbsttest
callerid=Selbsttest <+4940999000333>
direct_media=no

[selbsttest]
type=aor
contact=sip:callagent@127.0.0.1:5060

[selbsttest]
type=identify
endpoint=selbsttest
match=127.0.0.1

#tryinclude pjsip_callagent.conf
; Mandanten (gemivo Anrufassistent), erzeugt von server/mandant.js
#tryinclude pjsip_mandanten.conf
#tryinclude pjsip_testprov.conf
