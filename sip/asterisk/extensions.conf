; CallAgent - Dialplan
[general]
static=yes
writeprotect=yes

[default]
exten => _X.,1,Hangup()

; Eingehende Anrufe (Anbieter/FritzBox/Selbsttest) -> Gemma
[callagent-in]
exten => _[+0-9a-zA-Z].,1,Goto(callagent,s,1)
exten => s,1,Goto(callagent,s,1)

[callagent]
exten => s,1,NoOp(CallAgent Anruf von ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CA_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,System(mkdir -p /run/callagent-sip && echo '${FILTER(0-9+,${CALLERID(num)})}' > /run/callagent-sip/${CA_UUID})
 same => n,AudioSocket(${CA_UUID},127.0.0.1:3118)
 same => n,Hangup()

; Testanrufer fuer den Selbsttest: hoert Begruessung, sagt einen Satz, wartet auf Antwort
[testanrufer]
exten => s,1,Answer()
 same => n,MixMonitor(/var/spool/asterisk/monitor/callagent-selbsttest.wav)
 same => n,Wait(14)
 same => n,Playback(/var/lib/asterisk/sounds/callagent/anrufer-satz)
 same => n,Wait(35)
 same => n,Playback(/var/lib/asterisk/sounds/callagent/anrufer-tschuess)
 same => n,Wait(20)
 same => n,Hangup()
