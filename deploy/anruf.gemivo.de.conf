# anruf.gemivo.de - gemivo Anrufassistent (Next.js :3124)
server {
    listen 80;
    listen [::]:80;
    server_name anruf.gemivo.de;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anruf.gemivo.de;
    ssl_certificate /etc/letsencrypt/live/anruf.gemivo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anruf.gemivo.de/privkey.pem;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Interne Engine-Schnittstelle nie von aussen
    location /api/intern/ { return 404; }

    location = /download/gemivo-anruf.apk {
        alias /var/www/apk-host/anruf.gemivo.de/download/gemivo-anruf.apk;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /VERSION {
        proxy_pass http://127.0.0.1:3124;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        proxy_pass http://127.0.0.1:3124;
        add_header Cache-Control "no-cache, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:3124;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
