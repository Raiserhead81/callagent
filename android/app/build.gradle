apply plugin: 'com.android.application'

android {
    namespace 'de.gemivo.callagent'
    compileSdk 36
    defaultConfig {
        applicationId 'de.gemivo.callagent'
        minSdkVersion 29
        targetSdkVersion 29
        versionCode 9
        versionName '2.4'
    }
    // Vertriebswege: "direkt" = APK-Download von anruf.gemivo.de (unveraendert, targetSdk 29, wie auf Kays Handy),
    // "play" = Google Play (targetSdk 36 laut Play-Pflicht ab 31.08.2026, ohne Alt-Komponenten, siehe src/play/AndroidManifest.xml)
    flavorDimensions 'vertrieb'
    productFlavors {
        direkt { dimension 'vertrieb' }
        play {
            dimension 'vertrieb'
            targetSdkVersion 36
            versionNameSuffix '-play'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'          // HTTP
    implementation 'net.java.dev.jna:jna:5.13.0@aar'           // Vosk noetig
    implementation 'com.alphacephei:vosk-android:0.3.47'       // Offline-STT
}
