apply plugin: 'com.android.application'

android {
    namespace 'de.gemivo.callagent'
    compileSdk 34
    defaultConfig {
        applicationId 'de.gemivo.callagent'
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'          // HTTP
    implementation 'net.java.dev.jna:jna:5.13.0@aar'           // Vosk noetig
    implementation 'com.alphacephei:vosk-android:0.3.47'       // Offline-STT
}
